name: FOLD FORGE CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub Release with this tag (e.g. v1.0.0); empty = CI only'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Explicit package list: the action's default includes the legacy "tools" package, which current
      # cmdline-tools no longer provide (sdkmanager exits 1).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core + app/Robolectric)
        run: ./gradlew test
      - name: Lint
        run: ./gradlew lint
      - name: Build debug + release APKs
        run: ./gradlew assembleDebug assembleRelease
      - name: Checksums
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/FoldForge-1.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release/FoldForge-1.0.0-release-localsigned.apk
          (cd release && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: FoldForge-1.0.0-apks
          path: |
            release/*.apk
            release/SHA256SUMS
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/

  # Pushing a v* tag, or running the workflow with a release_tag input, publishes the APKs built and
  # tested above as a GitHub Release (pre-release while the app is a Release Candidate). Runs only after
  # both build and web QA pass; a dispatch creates the tag on the tested commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [build, web-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: FoldForge-1.0.0-apks
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "release tag must look like v1.0.0: $TAG"; exit 1;; esac
          (cd release && sha256sum -c SHA256SUMS)
          {
            cat RELEASE_NOTES_1.0.0.md
            echo
            echo "## Files attached to this release"
            echo "Built and tested by CI run [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) from \`${GITHUB_SHA::7}\`; these supersede the local-build sizes above."
            echo
            echo "| File | Size | SHA-256 |"
            echo "|---|---|---|"
            for f in release/*.apk; do
              echo "| $(basename "$f") | $(stat -c %s "$f") B | \`$(sha256sum "$f" | cut -d' ' -f1)\` |"
            done
            echo
            echo "Install: download \`FoldForge-1.0.0-release-localsigned.apk\` on the phone, open it and allow \"Install unknown apps\"."
          } > notes.md
          gh release create "$TAG" release/*.apk release/SHA256SUMS --target "$GITHUB_SHA" \
            --title "FOLD FORGE 1.0.0 (Release Candidate)" --notes-file notes.md --prerelease

  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run template QA in Chromium
        working-directory: tools/webqa
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          npm install
          node run-web-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-qa-report
          path: tools/webqa/last-report.json
